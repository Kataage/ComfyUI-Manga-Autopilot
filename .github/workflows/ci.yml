name: ci

on:
  push:
    branches: [main, "**"]
    tags: ["v*"]
  pull_request:
    branches: [main, develop]

jobs:
  backend:
    name: pytest + ruff (python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11"]
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install package + dev deps
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Run ruff
        run: ruff check .
      - name: Run pytest
        run: pytest tests/backend/ -q

  windows-persistence:
    name: windows persistence safety (python 3.11)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install package + dev deps
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"
      - name: Run focused Windows persistence safety suite
        run: >-
          python -m pytest
          tests/backend/test_windows_storage_safety.py
          tests/backend/test_storage_paths.py
          tests/backend/test_sqlite_connection.py
          tests/backend/test_master_database.py
          tests/backend/test_work_database.py
          tests/backend/test_migrations.py
          tests/backend/test_legacy_inventory.py
          tests/backend/test_work_manifest.py
          tests/backend/test_repository_transactions.py
          tests/backend/test_work_lifecycle_repository.py
          tests/backend/test_artifact_repository.py
          tests/backend/test_work_page_png_export.py
          tests/backend/test_work_export_center_routes.py
          tests/backend/test_export_center_browser_contract.py
          -q
