[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "comfyui-manga-autopilot"
version = "0.1.0-rc1"
description = "ComfyUI extension for end-to-end automated manga / Webtoon production."
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.10"
authors = [
    { name = "Kataage" },
]
keywords = ["comfyui", "manga", "webtoon", "autopilot", "stable-diffusion"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Topic :: Multimedia :: Graphics",
]
dependencies = [
    "aiohttp>=3.9",
    "pydantic>=2.6",
    "PyYAML>=6.0",
    "Pillow>=10.0",
    "jsonschema>=4.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "pytest-aiohttp>=1.0",
    "ruff>=0.4",
]
modal = [
    "modal>=0.64.0",
]
s3 = [
    "boto3>=1.34.0",
]

[project.urls]
Homepage = "https://github.com/Kataage/ComfyUI-Manga-Autopilot"
Issues = "https://github.com/Kataage/ComfyUI-Manga-Autopilot/issues"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"manga_autopilot.profiles" = ["*.json"]

[tool.pytest.ini_options]
testpaths = ["tests/backend"]
asyncio_mode = "auto"
addopts = "-ra"
markers = [
    "release_gate: v1.0 release gate smoke tests",
    "real_comfy: opt-in tests requiring a live ComfyUI server",
]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["E501"]
